<!DOCTYPE html>

<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hashtags">
  <title>Hashtag Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


:root {
  --bg: #080808;
  --card: #111111;
  --border: #222222;
  --accent: #ff3c00;
  --accent-dim: #1a0800;
  --text: #ffffff;
  --muted: #666666;
  --tag-bg: #1a1a1a;
  --tag-border: #2a2a2a;
}

body {
  background: var(--bg);
  font-family: 'Space Mono', monospace;
  color: var(--text);
  min-height: 100vh;
  padding: 24px 16px 40px;
  -webkit-tap-highlight-color: transparent;
}

.card {
  max-width: 480px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 28px;
}
.logo { font-family: 'Unbounded', sans-serif; font-size: 36px; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; }
.sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

.btn-tab {
  background: transparent;
  border: 1px solid #333;
  color: #888;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Count */
.section-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
.count-row { margin-bottom: 20px; }
.count-btns { display: flex; gap: 8px; }
.btn-count {
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  color: #888;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 14px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  transition: all 0.15s;
}
.btn-count.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* Big button */
.btn-go {
  width: 100%;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Unbounded', sans-serif;
  padding: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
  transition: transform 0.1s, opacity 0.1s;
  -webkit-appearance: none;
}
.btn-go:active { transform: scale(0.97); opacity: 0.9; }

/* Result */
.result-box {
  background: #0d0d0d;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 18px;
  display: none;
}
.result-box.show { display: block; animation: popIn 0.25s ease; }
.result-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag {
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  color: var(--accent);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: 700;
}
.tag.fixed {
  background: var(--accent-dim);
  border-color: var(--accent);
}

.copy-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.copy-status { font-size: 12px; color: var(--muted); }
.btn-copy {
  background: transparent;
  border: 1px solid #333;
  color: #888;
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
}

/* Manage view */
#view-manage { display: none; }
.manage-section { margin-bottom: 20px; }
textarea {
  width: 100%;
  background: #0d0d0d;
  border: 1px solid #222;
  border-radius: 8px;
  color: #ccc;
  padding: 12px;
  font-size: 13px;
  font-family: 'Space Mono', monospace;
  resize: vertical;
  margin-bottom: 10px;
  outline: none;
  -webkit-appearance: none;
}
.btn-add {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  padding: 10px 20px;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
}
.divider { height: 1px; background: #1a1a1a; margin-bottom: 16px; }
.tags-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 280px; overflow-y: auto; margin-bottom: 16px; }
.tag-manage {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  color: #aaa;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
}
.tag-manage.is-fixed { border-color: var(--accent); color: var(--accent); }
.btn-remove { background: transparent; border: none; color: #555; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }
.btn-clear {
  background: transparent;
  border: 1px solid #2a0000;
  color: #663333;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
}
.empty-hint {
  text-align: center;
  color: #444;
  font-size: 13px;
  padding: 20px;
  border: 1px dashed #222;
  border-radius: 10px;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.93) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shaking { animation: shake 0.4s ease; }

  <span>⚡</span><span id="btn-label">Дати 5 хештегів</span>

```

  </div>

  <!-- MANAGE VIEW -->

  <div id="view-manage">
    <div class="manage-section">
      <div class="section-label">Додати хештеги (пробіл, кома або новий рядок):</div>
      <textarea id="tag-input" rows="4" placeholder="#Shorts #Анекдоти comedy ..."></textarea>
      <button class="btn-add" onclick="addTags()">+ Додати</button>
    </div>
    <div class="divider"></div>
    <div class="tags-grid" id="tags-grid"></div>
    <button class="btn-clear" onclick="clearAll()">🗑 Очистити всі</button>
  </div>

</div>

<script>
  const FIXED = ["#anecdote", "#jokes"];
  const STORAGE_KEY = "hm-tags-v2";
  const DEFAULT_TAGS = ["#meme","#funny","#laugh","#humor","#comedy","#hilarious","#lol","#lmao","#haha","#rofl"];

  let tags = [];
  let count = 5;
  let currentResult = [];
  let currentView = "main";

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      tags = saved ? JSON.parse(saved) : [...DEFAULT_TAGS];
    } catch { tags = [...DEFAULT_TAGS]; }
    save();
    render();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tags)); } catch {}
    document.getElementById("tag-count").textContent = tags.length + " хештегів у базі";
  }

  function setCount(n) {
    count = n;
    document.querySelectorAll(".btn-count").forEach(b => b.classList.toggle("active", +b.textContent === n));
    document.getElementById("btn-label").textContent = "Дати " + n + " хештегів";
  }

  function getRandom() {
    if (tags.length === 0) { document.getElementById("empty-hint").style.display = "block"; return; }
    const pool = tags.filter(t => !FIXED.includes(t)).sort(() => Math.random() - 0.5);
    const extra = Math.max(0, count - FIXED.length);
    currentResult = [...FIXED, ...pool.slice(0, extra)];

    const box = document.getElementById("result-box");
    box.classList.remove("shaking");
    void box.offsetWidth;
    box.classList.add("show", "shaking");

    const container = document.getElementById("result-tags");
    container.innerHTML = currentResult.map(t =>
      `<span class="tag${FIXED.includes(t) ? " fixed" : ""}">${t}${FIXED.includes(t) ? " 📌" : ""}</span>`
    ).join("");

    copyToClipboard(currentResult.join(" "));
  }

  function copyResult() { copyToClipboard(currentResult.join(" ")); }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      const s = document.getElementById("copy-status");
      s.textContent = "✅ Скопійовано!";
      setTimeout(() => s.textContent = "📋 Тисни — скопіює знову", 2000);
    }).catch(() => {
      // fallback for older Safari
      const el = document.createElement("textarea");
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand("copy");
      document.body.removeChild(el);
      const s = document.getElementById("copy-status");
      s.textContent = "✅ Скопійовано!";
      setTimeout(() => s.textContent = "📋 Тисни — скопіює знову", 2000);
    });
  }

  function addTags() {
    const input = document.getElementById("tag-input").value;
    const newTags = input.split(/[\n,\s]+/).map(t => t.trim()).filter(t => t.length > 0)
      .map(t => t.startsWith("#") ? t : "#" + t);
    tags = [...new Set([...tags, ...newTags])];
    save();
    render();
    document.getElementById("tag-input").value = "";
  }

  function removeTag(tag) {
    if (FIXED.includes(tag)) return;
    tags = tags.filter(t => t !== tag);
    save();
    render();
  }

  function clearAll() {
    if (confirm("Видалити всі хештеги?")) {
      tags = [];
      save();
      render();
      document.getElementById("result-box").classList.remove("show");
    }
  }

  function render() {
    const grid = document.getElementById("tags-grid");
    const allTags = [...new Set([...FIXED, ...tags])];
    grid.innerHTML = allTags.map(t => {
      const isFixed = FIXED.includes(t);
      return `<div class="tag-manage${isFixed ? " is-fixed" : ""}">
        <span>${t}${isFixed ? " 📌" : ""}</span>
        ${isFixed ? "" : `<button class="btn-remove" onclick="removeTag('${t}')">✕</button>`}
      </div>`;
    }).join("");

    document.getElementById("empty-hint").style.display = tags.length === 0 ? "block" : "none";
    document.getElementById("tag-count").textContent = (tags.length + FIXED.length) + " хештегів у базі";
  }

  function toggleView() {
    currentView = currentView === "main" ? "manage" : "main";
    document.getElementById("view-main").style.display = currentView === "main" ? "block" : "none";
    document.getElementById("view-manage").style.display = currentView === "manage" ? "block" : "none";
    const btn = document.getElementById("btn-toggle");
    btn.textContent = currentView === "manage" ? "← Назад" : "⚙ Керувати";
    btn.classList.toggle("active", currentView === "manage");
  }

  load();
</script>

</body>
